# Conda environment for GRETEL.
#
#     conda env create -f environment.yml
#     conda activate GRETEL
#
# This builds the CPU environment. For CUDA, run scripts/setup-grtl-gpu.sh
# instead: it creates the same environment and then reinstalls torch,
# torchvision and torchaudio from the cu121 wheel index.
#
# Python is pinned to 3.9 because that is what the published results were
# produced with, and because several pins in requirements-lock.txt (numpy
# 1.26, torch 2.5.1) are what that interpreter resolves to.
name: GRETEL
channels:
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - pip:
      - -r requirements-lock.txt
